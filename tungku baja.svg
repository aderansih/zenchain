<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #121010;">
  <defs>
    <!-- Efek Cahaya (Glow) untuk cairan baja -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradasi Baja Cair (Kuning ke Oranye kemerahan) -->
    <linearGradient id="gradBaja" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d00" />
      <stop offset="50%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#ff4d00" />
    </linearGradient>

    <!-- Gradasi Besi Tungku -->
    <linearGradient id="gradTungku" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="20%" stop-color="#555555" />
      <stop offset="80%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- Cahaya Ambien Latar Belakang -->
    <radialGradient id="gradAmbien" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#4a1500" />
      <stop offset="100%" stop-color="#121010" />
    </radialGradient>
  </defs>

  <!-- 1. Background Pabrik -->
  <rect width="800" height="600" fill="#eeeeee"/>
  
  <!-- Struktur Tiang Pabrik (Latar Belakang) -->
  <rect x="100" y="0" width="30" height="600" fill="#0d0c0c" />
  <rect x="650" y="0" width="50" height="600" fill="#0d0c0c" />
  <path d="M 0 100 L 800 150 L 800 180 L 0 130 Z" fill="#0d0c0c" opacity="0.5" />

  <!-- 2. Kabel/Rantai Derek (Statis, menahan poros tungku) -->
  <line x1="450" y1="0" x2="450" y2="250" stroke="#222" stroke-width="8" />

  <!-- 3. Wadah Cetakan Bawah (Tempat baja dituang) -->
  <g id="cetakan-bawah">
    <path d="M 120 500 L 320 500 L 300 600 L 140 600 Z" fill="#222" />
    <!-- Efek Wadah Menyala saat baja masuk -->
    <ellipse cx="220" cy="500" rx="60" ry="15" fill="#ff4d00" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.8; 0.8; 0; 0" keyTimes="0; 0.19; 0.22; 0.58; 0.62; 1" dur="8s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- 4. Aliran Baja Cair (Animasi Turun) -->
  <!-- Aliran ini disinkronkan agar keluar persis dari bibir tungku saat miring (-45 derajat) -->
  <path fill="url(#gradBaja)" filter="url(#glow)">
    <animate attributeName="d" 
             values="
               M 207 342 L 227 342 L 227 342 L 207 342;
               M 207 342 L 227 342 L 227 342 L 207 342;
               M 207 342 L 227 342 L 227 500 L 207 500;
               M 207 342 L 227 342 L 227 500 L 207 500;
               M 207 500 L 227 500 L 227 500 L 207 500;
               M 207 500 L 227 500 L 227 500 L 207 500" 
             keyTimes="0; 0.14; 0.19; 0.59; 0.64; 1" 
             dur="8s" 
             repeatCount="indefinite" />
  </path>

  <!-- 5. Percikan Api (Sparks) -->
  <!-- Grup percikan ini hanya muncul saat aliran menyentuh dasar -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.19; 0.2; 0.59; 0.6; 1" dur="8s" repeatCount="indefinite"/>
    
    <!-- Partikel Percikan 1 -->
    <circle cx="217" cy="500" r="3" fill="#ffea00" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 -60; -60 -20; -70 30" keyTimes="0; 0.3; 0.7; 1" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.5; 0.8; 1" dur="0.8s" repeatCount="indefinite" />
    </circle>
    
    <!-- Partikel Percikan 2 -->
    <circle cx="217" cy="500" r="4" fill="#ff4d00" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 -80; 50 -30; 60 40" keyTimes="0; 0.4; 0.8; 1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.6; 0.9; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Partikel Percikan 3 -->
    <circle cx="217" cy="500" r="2.5" fill="#ffffff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -10 -90; -15 -40; -20 10" keyTimes="0; 0.3; 0.7; 1" dur="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.4; 0.7; 1" dur="0.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 6. Grup Tungku / Crucible (Berotasi) -->
  <!-- Berputar dengan titik tumpu (pivot) di koodinat X=450, Y=250 -->
  <g id="tungku">
    <animateTransform attributeName="transform" 
                      type="rotate" 
                      values="0 450 250; -45 450 250; -45 450 250; 0 450 250; 0 450 250" 
                      keyTimes="0; 0.15; 0.6; 0.75; 1" 
                      dur="8s" 
                      repeatCount="indefinite" />

    <!-- Dinding belakang tungku (Dalam) -->
    <path d="M 230 150 L 450 150 L 420 190 L 260 190 Z" fill="#4a1500" />
    
    <!-- Permukaan Cairan Baja di dalam tungku -->
    <ellipse cx="340" cy="150" rx="110" ry="12" fill="#ffcc00" filter="url(#glow)" />
    
    <!-- Bibir / Cerobong Tuang (Kiri) -->
    <path d="M 220 150 L 240 150 L 230 180 Z" fill="url(#gradTungku)" />

    <!-- Badan Utama Tungku -->
    <path d="M 235 150 L 460 150 L 430 380 L 265 380 Z" fill="url(#gradTungku)" />
    
    <!-- Sabuk Besi Penahan Tungku -->
    <path d="M 245 220 L 450 220" stroke="#222" stroke-width="15" />
    <path d="M 255 310 L 440 310" stroke="#222" stroke-width="15" />

    <!-- Detail Percikan Kecil di Bibir Tungku -->
    <circle cx="225" cy="150" r="8" fill="#ffea00" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.14; 0.6; 0.65; 1" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 7. Detail Depan (Statis menutupi poros tungku agar terlihat logis) -->
  <circle cx="450" cy="250" r="25" fill="#333" />
  <circle cx="450" cy="250" r="10" fill="#111" />
  <rect x="430" y="220" width="40" height="15" fill="#444" />
</svg>

